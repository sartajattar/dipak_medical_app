<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Medical - DOSE-IN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-800">DOSE-IN मेडिकल नोंदणी</h1>
            <p class="text-xs text-slate-500 mt-1">दीपक मेडिकलने अप्रूव्ह केल्यानंतर तुमचे खाते सुरू होईल.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-xs font-bold bg-rose-100 text-rose-800">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">मेडिकल स्टोअरचे नाव</label>
                <input type="text" name="medical_name" required placeholder="उदा. श्री गणेश मेडिकल" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">मालकाचे / केमिस्टचे नाव</label>
                <input type="text" name="owner_name" required placeholder="पूर्ण नाव" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">मोबाईल नंबर (लॉगिनसाठी)</label>
                    <input type="tel" name="phone" required placeholder="१० अंकी मोबाईल नंबर" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">गाव / शहर (Location)</label>
                    <input type="text" name="location" required placeholder="उदा. बार्शी, सोलापूर" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">पासवर्ड तयार करा</label>
                <input type="password" name="password" required placeholder="नवीन पासवर्ड टाका" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm shadow transition">
                नोंदणी करा व मंजुरीसाठी पाठवा
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/login" class="text-xs text-sky-600 font-bold hover:underline">आधीच अकाउंट आहे? येथे लॉगिन करा</a>
        </div>
    </div>
</body>
</html>
